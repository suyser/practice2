<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Построй страницу</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--text:#22204a;--mut:#6b6990;--code:#ece9fb;--ok:#1fa463;--bad:#e5484d;--acc:#6c4cf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17152b;--card:#232042;--text:#f0eeff;--mut:#a9a6d0;--code:#1a1833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:12px}
h1{margin:4px 0;font-size:24px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--card);color:var(--text);box-shadow:0 2px 0 rgba(0,0,0,.15)}
button.main{background:var(--acc);color:#fff;font-weight:700}
.score{background:var(--card);display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;margin:6px 0}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lv button{width:42px;padding:8px 0;text-align:center}
.lv .cur{background:var(--acc);color:#fff}.lv .done{background:var(--ok);color:#fff}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lab{color:var(--mut);font-size:14px;margin-bottom:6px}
.browser{background:#fff;color:#111;border-radius:10px;border:2px solid #cfcbe8;overflow:hidden;font:16px/1.4 system-ui,sans-serif}
.browser .tab{background:#e4e1f5;padding:5px 10px;font-size:13px;color:#444}
.browser .pg{padding:10px 14px;min-height:80px}
.browser h1{font-size:24px;margin:4px 0}.browser h2{font-size:20px;margin:4px 0}.browser p{margin:6px 0}
.browser ul,.browser ol{margin:4px 0;padding-left:24px}
.browser div{border:1px dashed #aaa;padding:6px;margin:4px 0}
.im{display:inline-block;background:#dfe8ff;border-radius:8px;padding:12px 18px;margin:4px 0}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.blk{font:14px ui-monospace,monospace;background:var(--code);box-shadow:none;padding:7px 9px;text-align:left;border:2px solid transparent}
pre{margin:0;background:var(--code);border-radius:10px;padding:8px;min-height:60px;font:14px/1.3 ui-monospace,monospace}
.ln{display:block;width:100%;text-align:left;background:transparent;box-shadow:none;padding:3px 6px;font:14px ui-monospace,monospace;white-space:pre;border-radius:6px}
.ln.err{background:var(--bad);color:#fff}
.msg{min-height:26px;margin:8px 0;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🏠 Построй страницу</h1>
<div class="score">⭐ Очки: <b id="sc">0</b></div>
<div class="lv" id="lv"></div>
<div class="card" id="g"></div>
</div>
<script>
const L=[
{a:["<h1>Привет!</h1>","<p>Я учусь HTML</p>"]},
{a:["<html>","<head>","<title>Мой сайт</title>","</head>","<body>","<h1>Привет!</h1>","</body>","</html>"]},
{a:["<body>","<h1>Мой кот</h1>","<p>Он рыжий.</p>","<p>Он любит спать.</p>","</body>"]},
{a:["<h2>Покупки</h2>","<ul>","<li>Хлеб</li>","<li>Молоко</li>","<li>Сыр</li>","</ul>"]},
{a:["<h2>Рецепт чая</h2>","<ol>","<li>Вскипяти воду</li>","<li>Положи пакетик</li>","<li>Подожди 3 минуты</li>","</ol>"]},
{a:["<h1>Мои ссылки</h1>","<p>Поиск: <a href=\"https://ya.ru\">Яндекс</a></p>"],x:["<p>Поиск: <a>Яндекс</a></p>"]},
{a:["<h1>Мой питомец</h1>","<img src=\"cat.jpg\" alt=\"Рыжий кот\">","<p>Это Мурзик.</p>"],x:["<img alt=\"Рыжий кот\">"]},
{a:["<h1>Правила</h1>","<p>Это <b>важно</b> и <i>красиво</i>.</p>"],x:["<p>Это <b>важно</p></b>"]},
{a:["<html>","<head>","<title>Мой кот</title>","</head>","<body>","<h1>Мурзик</h1>","<p>Мой <b>любимый</b> кот.</p>","</body>","</html>"],x:["<p>Текст в head</p>","<h6>Мелкий заголовок</h6>"]},
{a:["<div>","<h2>Планы</h2>","<ul>","<li>Учёба</li>","<li>Игры</li>","</ul>","</div>"],x:["</ol>","<li>Сон"]},
{a:["<form>","<p>Как тебя зовут?</p>","<input type=\"text\">","<button>Отправить</button>","</form>"],x:["<input type=\"checkbox\">","</input>"]},
{a:["<ul>","<li>Фрукты","<ul>","<li>Яблоко</li>","<li>Груша</li>","</ul>","</li>","<li>Овощи</li>","</ul>"],x:["<ol>","</ol>"]},
{a:["<div>","<img src=\"cat.jpg\" alt=\"Кот\">","<h2>Мурзик</h2>","<p>Возраст: 3 года</p>","<a href=\"#\">Подробнее</a>","</div>"],x:["<h1>Мурзик</h1>","<a>Подробнее</a>"]},
{a:["<html>","<head>","<title>Кружок</title>","</head>","<body>","<h1>Кружок робототехники</h1>","<p>Приходи по <b>вторникам</b>!</p>","<ul>","<li>Паяем</li>","<li>Программируем</li>","</ul>","<a href=\"#\">Записаться</a>","</body>","</html>"],x:["<h6>Кружок</h6>","<ol>","</ol>"]},
{a:["<html>","<head>","<title>Моя анкета</title>","</head>","<body>","<h1>Анкета</h1>","<img src=\"cat.jpg\" alt=\"Логотип\">","<p>Заполни <i>все</i> поля.</p>","<ol>","<li>Имя</li>","<li>Класс</li>","</ol>","<form>","<input type=\"text\">","<button>Готово</button>","</form>","<a href=\"#\">Назад</a>","</body>","</html>"],x:["<h6>Анкета</h6>","<a>Назад</a>","</input>","<ul>"]}
];
let S=0,cur=0,done=new Set(),items,pool,built,mist,solved;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const diff=n=>n<5?1:n<10?2:3;
const VOID=/^<(img|input|br|meta)/;
function indent(lines){let d=0;return lines.map(t=>{if(t.startsWith('</'))d=Math.max(0,d-1);const s='  '.repeat(d)+t;
  if(!t.startsWith('</')&&!VOID.test(t)&&!t.includes('</'))d++;return s})}
function prev(a){let h=a.join('');const t=(h.match(/<title>(.*?)<\/title>/)||[])[1]||'';
  h=h.replace(/<head>.*<\/head>/,'').replace(/<\/?(html|body)>/g,'').replace(/<img[^>]*alt="([^"]*)"[^>]*>/g,'<span class="im">🖼 $1</span>').replace(/<a href="[^"]*"/g,'<a href="#"');
  return [h,t]}
function head(){
  $('#sc').textContent=S;
  $('#lv').innerHTML=L.map((_,n)=>`<button class="${n===cur?'cur':done.has(n)?'done':''}" onclick="go(${n})">${n+1}</button>`).join('');
}

function go(n){
  cur=n;const l=L[n];
  items=l.a.concat(l.x||[]);pool=shuf(items.map((_,k)=>k));built=[];mist=0;solved=false;head();draw();
}
function draw(){
  const l=L[cur],[h,t]=prev(l.a);
  $('#g').innerHTML=`<div class="lab">Уровень ${cur+1} · сложность ${'⭐'.repeat(diff(cur))}</div>
  <div class="cols"><div><div class="lab">Что должно получиться</div><div class="browser"><div class="tab">${t?'📄 '+esc(t):'📄 (без названия)'}</div><div class="pg" id="pv">${h}</div></div></div>
  <div><div class="lab">Нужные блоки (в наборе ${items.length}${l.x?', есть лишние!':''}). Нажми, чтобы взять</div><div class="pool" id="pl"></div></div></div>
  <div class="lab" style="margin-top:12px">Твой код (нажми на строку, чтобы вернуть блок)</div><pre id="bd"></pre>
  <div class="msg" id="m"></div>
  <div class="row"><button class="main" onclick="check()">Проверить</button><button onclick="go(cur)">Сначала</button><button onclick="nxt()">${solved?'Дальше →':'Пропустить →'}</button></div>`;
  $('#pv').querySelectorAll('a').forEach(a=>a.onclick=e=>e.preventDefault());
  $('#pl').innerHTML=pool.map(id=>`<button class="blk" onclick="take(${id})">${esc(items[id])}</button>`).join('');
  drawB();
}
function drawB(err){
  const ls=indent(built.map(id=>items[id]));
  $('#bd').innerHTML=ls.length?ls.map((s,k)=>`<button class="ln ${k===err?'err':''}" onclick="back(${k})">${esc(s)}</button>`).join(''):'<span style="color:var(--mut)">(пока пусто)</span>';
}
function take(id){if(solved)return;pool=pool.filter(x=>x!==id);built.push(id);draw()}
function back(k){if(solved)return;pool.push(built.splice(k,1)[0]);draw()}
function check(){
  const a=L[cur].a,b=built.map(id=>items[id]);
  let bad=a.findIndex((t,k)=>b[k]!==t);
  if(b.length>a.length&&bad<0)bad=a.length;
  const m=$('#m');
  if(bad<0&&b.length===a.length){
    solved=true;const pts=Math.max(1,diff(cur)-mist);S+=pts;done.add(cur);
    m.className='msg ok';m.textContent=`✅ Верно! +${pts}`;head();
    document.querySelector('.row button:last-child').textContent='Дальше →';
  }else{
    mist++;m.className='msg no';
    if(bad>=b.length){m.textContent=`Пока совпадает всё, что собрано (${b.length}). Не хватает блоков.`;drawB()}
    else{m.textContent=`Первая ошибка в строке ${bad+1}. Подумай: что должно идти здесь?`;drawB(bad)}
  }
}
function nxt(){go((cur+1)%L.length)}
go(0);
</script>
</body>
</html>
